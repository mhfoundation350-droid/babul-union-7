<div id="wardsContainer">
  <h3>🏠 ইউনিয়নের ৯টি ওয়ার্ড</h3>
  <p>লোড হচ্ছে...</p>
</div>

<style>
.ward-card{background:#e8f5e9;border-left:4px solid #2e7d32;padding:15px;margin:10px 0;border-radius:8px}
.btn-group{display:flex;gap:10px;margin-top:8px;flex-wrap:wrap}
.btn{padding:9px 16px;border-radius:6px;text-decoration:none;font-weight:bold;font-size:14px;display:flex;align-items:center;gap:6px}
.call-btn{background:#fff;color:#000;border:1px solid #ccc}
.whatsapp-btn{background:#25D366;color:#fff;border:1px solid #25D366}
</style>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, collection, getDocs, query, orderBy } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBV_XpVRx7fbIMBSDmcjc6BNxIoamQ7SoA",
  authDomain: "babul-union-7.firebaseapp.com",
  projectId: "babul-union-7",
  storageBucket: "babul-union-7.firebasestorage.app",
  messagingSenderId: "424653767943",
  appId: "1:424653767943:web:696e371ded9477e04831a2"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

async function loadWardsUser(){
  const q = query(collection(db, "wards"), orderBy("wardNo"));
  const snap = await getDocs(q);
  let html = '<h3>🏠 ইউনিয়নের ৯টি ওয়ার্ড</h3>';
  snap.forEach((d) => {
    const data = d.data();
    const showNumber = data.mobile; 
    let phone = data.mobile.replace(/\D/g,''); 
    if(phone.startsWith('0')) phone = '88' + phone; // +88 লুকানো

    html += `<div class="ward-card">
      <b>ওয়ার্ড ${data.wardNo}</b><br>
      প্রতিনিধি: ${data.name}<br>
      মোবাইল: ${showNumber}
      <div class="btn-group">
        <a href="tel:${phone}" class="btn call-btn">📞 কল করুন</a>
        <a href="https://wa.me/${phone}" target="_blank" class="btn whatsapp-btn">💬 WhatsApp</a>
      </div>
    </div>`;
  });
  document.getElementById('wardsContainer').innerHTML = html || '<p>এখনো কোনো প্রতিনিধি যোগ হয়নি</p>';
}
loadWardsUser();
</script>
