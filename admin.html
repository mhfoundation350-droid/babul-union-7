<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<title>Babul Union 7 - Admin Panel</title>
<style>
body{font-family:sans-serif;background:#f0f2f5;padding:20px}
.container{max-width:600px;margin:auto;background:#fff;padding:20px;border-radius:8px}
input,textarea{width:100%;padding:10px;margin:10px 0;border:1px solid #ddd;border-radius:4px}
button{background:#1877f2;color:#fff;padding:10px 20px;border:none;border-radius:4px;cursor:pointer}
.post{border:1px solid #ddd;padding:10px;margin:10px 0;border-radius:4px}
</style>
</head>
<body>
<div class="container">
<h2>নতুন পোস্ট যোগ করুন</h2>
<input type="text" id="title" placeholder="শিরোনাম লিখুন">
<textarea id="desc" placeholder="বিবরণ লিখুন" rows="5"></textarea>
<button onclick="addPost()">পোস্ট করুন</button>
<h3>আপনার পোস্ট সমূহ</h3>
<div id="posts">লোড হচ্ছে...</div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, collection, addDoc, getDocs, query, orderBy } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

// Your web app's Firebase configuration
const firebaseConfig = {
  apiKey: "AIzaSyBV_XpVRx7fbIMBSDmcjc6BNxIoamQ7SoA",
  authDomain: "babul-union-7.firebaseapp.com",
  projectId: "babul-union-7",
  storageBucket: "babul-union-7.firebasestorage.app",
  messagingSenderId: "424653767943",
  appId: "1:424653767943:web:696e371ded9477e04831a2"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

window.addPost = async function() {
  const title = document.getElementById('title').value;
  const desc = document.getElementById('desc').value;
  if(title && desc){
    await addDoc(collection(db, "posts"), {
      title: title,
      description: desc,
      date: new Date()
    });
    document.getElementById('title').value = '';
    document.getElementById('desc').value = '';
    loadPosts();
    alert('পোস্ট হয়ে গেছে!');
  } else {
    alert('শিরোনাম ও বিবরণ লিখুন');
  }
}

async function loadPosts() {
  const q = query(collection(db, "posts"), orderBy("date", "desc"));
  const querySnapshot = await getDocs(q);
  const postsDiv = document.getElementById('posts');
  postsDiv.innerHTML = '';
  querySnapshot.forEach((doc) => {
    postsDiv.innerHTML += `<div class="post"><h4>${doc.data().title}</h4><p>${doc.data().description}</p></div>`;
  });
}
loadPosts();
</script>
</body>
</html>
