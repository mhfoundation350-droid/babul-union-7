<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<title>Admin Panel - Babul Union</title>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<style>
body{font-family:Arial; background:#f0f2f5; padding:20px}
.box{max-width:600px; margin:auto; background:#fff; padding:20px; border-radius:10px; box-shadow:0 0 10px #ccc}
input,textarea,button{width:100%; padding:10px; margin:8px 0; border:1px solid #ccc; border-radius:5px}
button{background:#007bff; color:#fff; border:none; cursor:pointer}
button:hover{background:#0056b3}
#logout{float:right; background:red}
</style>
</head>
<body>

<div class="box" id="login-box">
  <h2>Admin Login</h2>
  <input type="email" id="email" placeholder="Email">
  <input type="password" id="password" placeholder="Password">
  <button onclick="login()">Login</button>
  <p id="error" style="color:red"></p>
</div>

<div class="box" id="admin-box" style="display:none">
  <button id="logout" onclick="logout()">Logout</button>
  <h2>নতুন পোস্ট যোগ করুন</h2>
  <input type="text" id="title" placeholder="শিরোনাম">
  <textarea id="desc" placeholder="বিবরণ" rows="5"></textarea>
  <button onclick="addPost()">পোস্ট করুন</button>
  <p id="msg" style="color:green"></p>
</div>

<script>
// আপনার Firebase Config এখানে বসবে
const firebaseConfig = {
  apiKey: "AIza...",
  authDomain: "babul-union-7.firebaseapp.com",
  projectId: "babul-union-7",
  storageBucket: "babul-union-7.appspot.com",
  messagingSenderId: "...",
  appId: "..."
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

// Login
function login(){
  const email = document.getElementById('email').value;
  const pass = document.getElementById('password').value;
  auth.signInWithEmailAndPassword(email, pass)
  .then(()=>{
    document.getElementById('login-box').style.display='none';
    document.getElementById('admin-box').style.display='block';
  })
  .catch(err=>{document.getElementById('error').innerText=err.message})
}

// Logout
function logout(){auth.signOut(); location.reload()}

// Add Post
function addPost(){
  const title = document.getElementById('title').value;
  const desc = document.getElementById('desc').value;
  db.collection("posts").add({
    title: title,
    description: desc,
    time: new Date()
  }).then(()=>{
    document.getElementById('msg').innerText="পোস্ট সফলভাবে যোগ হয়েছে!";
    document.getElementById('title').value='';
    document.getElementById('desc').value='';
  })
}

auth.onAuthStateChanged(user=>{
  if(user){
    document.getElementById('login-box').style.display='none';
    document.getElementById('admin-box').style.display='block';
  }
})
</script>
</body>
</html>
