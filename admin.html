<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Panel - Babul Union 7</title>
<style>
body{font-family:'SolaimanLipi',sans-serif;background:#f0f2f5;padding:20px;margin:0}
.container{max-width:900px;margin:auto;background:#fff;padding:25px;border-radius:10px;box-shadow:0 2px 8px rgba(0,0,0,0.1)}
h2{color:#1877f2;text-align:center}
input{width:100%;padding:12px;margin:8px 0;border:1px solid #ddd;border-radius:6px;box-sizing:border-box;font-size:16px}
button{background:#1877f2;color:#fff;padding:12px 18px;border:none;border-radius:6px;cursor:pointer;margin:5px;font-size:15px;font-weight:bold}
button:hover{background:#166fe5}
.del-btn{background:#dc3545}
.edit-btn{background:#ffc107;color:#000}
.section{border:2px solid #1877f2;padding:20px;margin:25px 0;border-radius:10px}
.section h3{margin-top:0;color:#2e7d32}
img.preview{width:120px;height:120px;border-radius:50%;object-fit:cover;border:4px solid #2e7d32;margin:10px 0}
img.banner-preview{width:100%;height:200px;object-fit:cover;border-radius:8px;margin:10px 0}
</style>
</head>
<body>
<div class="container">
<h2>ওয়েবসাইট কন্ট্রোল প্যানেল</h2>

<!-- 1. HERO SETTINGS -->
<div class="section">
  <h3>🏆 Hero Section সেটিংস</h3>
  <input type="text" id="candidateName" placeholder="প্রার্থীর নাম - মোঃ বাবুল">
  <input type="text" id="slogan" placeholder="স্লোগান - উন্নয়ন, সততা ও জনসেবার অঙ্গীকার">
  <label><b>লোগো/প্রার্থীর ছবি:</b></label>
  <input type="file" id="logoUpload" accept="image/*">
  <img id="logoPreview" class="preview" src="" style="display:none">

  <label><b>Hero Banner Background:</b></label>
  <input type="file" id="bannerUpload" accept="image/*">
  <img id="bannerPreview" class="banner-preview" src="" style="display:none">

  <button onclick="saveSettings()">সেটিংস সেভ করুন</button>
</div>

<!-- 2. WARD REPRESENTATIVES -->
<div class="section">
  <h3>🏘️ ওয়ার্ড প্রতিনিধি</h3>
  <input type="text" id="wardNo" placeholder="ওয়ার্ড নং - যেমন: 1">
  <input type="text" id="name" placeholder="প্রতিনিধির নাম">
  <input type="tel" id="mobile" placeholder="মোবাইল নাম্বার - 01645444350">
  <button onclick="saveWard()">সেভ করুন</button>
  <h3 style="margin-top:30px;">সকল প্রতিনিধি</h3>
  <div id="wardList">লোড হচ্ছে...</div>
</div>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, collection, addDoc, getDocs, deleteDoc, updateDoc, doc, query, orderBy, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-storage.js";

const firebaseConfig = {
  apiKey: "AIzaSyBV_XpVRx7fbIMBSDmcjc6BNxIoamQ7SoA",
  authDomain: "babul-union-7.firebaseapp.com",
  projectId: "babul-union-7",
  storageBucket: "babul-union-7.firebasestorage.app",
  messagingSenderId: "424653767943",
  appId: "1:424653767943:web:696e371ded9477e04831a2"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const storage = getStorage(app);
let editingId = null;

// Preview
document.getElementById('logoUpload').onchange = e => {
  const file = e.target.files[0];
  document.getElementById('logoPreview').src = URL.createObjectURL(file);
  document.getElementById('logoPreview').style.display = 'block';
}
document.getElementById('bannerUpload').onchange = e => {
  const file = e.target.files[0];
  document.getElementById('bannerPreview').src = URL.createObjectURL(file);
  document.getElementById('bannerPreview').style.display = 'block';
}

// সেটিংস সেভ
window.saveSettings = async function() {
  const name = document.getElementById('candidateName').value;
  const slogan = document.getElementById('slogan').value;
  const logoFile = document.getElementById('logoUpload').files[0];
  const bannerFile = document.getElementById('bannerUpload').files[0];

  let logoUrl = "", bannerUrl = "";

  if(logoFile){
    const storageRef = ref(storage, 'settings/logo_' + Date.now() + '.jpg');
    const snap = await uploadBytes(storageRef, logoFile);
    logoUrl = await getDownloadURL(snap.ref);
  }
  if(bannerFile){
    const storageRef = ref(storage, 'settings/banner_' + Date.now() + '.jpg');
    const snap = await uploadBytes(storageRef, bannerFile);
    bannerUrl = await getDownloadURL(snap.ref);
  }

  await setDoc(doc(db, "settings", "hero"), {name, slogan, logoUrl, bannerUrl}, {merge: true});
  alert('সেটিংস আপডেট হয়েছে');
}

// ওয়ার্ড সেভ
window.saveWard = async function() {
  const wardNo = document.getElementById('wardNo').value.trim();
  const name = document.getElementById('name').value.trim();
  const mobile = document.getElementById('mobile').value.trim();
  if(!wardNo ||!name ||!mobile) return alert('সব ঘর পূরণ করুন');

  if(editingId){
    await updateDoc(doc(db, "wards", editingId), {wardNo, name, mobile});
    editingId = null;
    alert('আপডেট হয়েছে');
  } else {
    await addDoc(collection(db, "wards"), {wardNo, name, mobile});
    alert('যোগ হয়েছে');
  }
  document.getElementById('wardNo').value = '';
  document.getElementById('name').value = '';
  document.getElementById('mobile').value = '';
  loadWards();
}

window.editWard = function(id, wardNo, name, mobile){
  editingId = id;
  document.getElementById('wardNo').value = wardNo;
  document.getElementById('name').value = name;
  document.getElementById('mobile').value = mobile;
  window.scrollTo(0,0);
}

window.deleteWard = async function(id){
  if(confirm('ডিলিট করতে চান?')){
    await deleteDoc(doc(db, "wards", id));
    loadWards();
  }
}

async function loadWards() {
  const q = query(collection(db, "wards"), orderBy("wardNo"));
  const snap = await getDocs(q);
  let html = '';
  snap.forEach((d) => {
    const data = d.data();
    html += `<div class="ward-box">
      <b>ওয়ার্ড ${data.wardNo}</b><br>
      প্রতিনিধি: ${data.name}<br>
      মোবাইল: ${data.mobile}<br>
      <button class="edit-btn" onclick="editWard('${d.id}','${data.wardNo}','${data.name}','${data.mobile}')">Edit</button>
      <button class="del-btn" onclick="deleteWard('${d.id}')">Delete</button>
    </div>`;
  });
  document.getElementById('wardList').innerHTML = html || 'কোনো প্রতিনিধি নেই';
}
loadWards();
</script>
</body>
</html>
