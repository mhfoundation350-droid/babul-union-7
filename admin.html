<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Panel - Babul Union 7</title>
<style>
body{font-family:'SolaimanLipi',sans-serif;background:#f0f2f5;padding:15px;margin:0}
.container{max-width:800px;margin:auto;background:#fff;padding:15px;border-radius:8px;box-shadow:0 2px 6px rgba(0,0,0,0.1)}
h2{color:#1877f2;text-align:center;font-size:22px;margin-bottom:15px}
input{width:100%;padding:8px;margin:6px 0;border:1px solid #ddd;border-radius:5px;box-sizing:border-box;font-size:14px}
button{background:#1877f2;color:#fff;padding:8px 14px;border:none;border-radius:5px;cursor:pointer;margin:4px;font-size:14px;font-weight:bold}
button:hover{background:#166fe5}
.del-btn{background:#dc3545}
.edit-btn{background:#ffc107;color:#000}
.section{border:1px solid #1877f2;padding:12px;margin:15px 0;border-radius:8px}
.section h3{margin:0 0 10px 0;color:#2e7d32;font-size:16px}
img.preview{width:80px;height:80px;border-radius:50%;object-fit:cover;border:3px solid #2e7d32;margin:8px 0}
img.banner-preview{width:100%;height:120px;object-fit:cover;border-radius:6px;margin:8px 0}
.ward-box{border:1px solid #ddd;padding:10px;margin:8px 0;border-radius:6px;background:#f9f9f9;font-size:14px}
#status{padding:8px;margin:8px 0;border-radius:5px;display:none;font-size:14px}
.success{background:#d4edda;color:#155724}
input[type="file"]{border:none;padding:0}
</style>
</head>
<body>
<div class="container">
<h2>ওয়েবসাইট কন্ট্রোল প্যানেল</h2>
<div id="status"></div>

<!-- 1. HERO SETTINGS -->
<div class="section">
  <h3>🏆 Hero Section সেটিংস</h3>
  <input type="text" id="candidateName" placeholder="প্রার্থীর নাম - মোহাম্মদ বাবুল">
  <input type="text" id="slogan" placeholder="স্লোগান">

  <label><b>লোগো ছবি Upload করুন:</b></label>
  <input type="file" id="logoUpload" accept="image/*">
  <img id="logoPreview" class="preview" src="" style="display:none">

  <label><b>Banner ছবি Upload করুন:</b></label>
  <input type="file" id="bannerUpload" accept="image/*">
  <img id="bannerPreview" class="banner-preview" src="" style="display:none">

  <button onclick="saveSettings()">সেভ করুন</button>
</div>

<!-- 2. WARD REPRESENTATIVES -->
<div class="section">
  <h3>🏘️ ওয়ার্ড প্রতিনিধি</h3>
  <input type="text" id="wardNo" placeholder="ওয়ার্ড নং">
  <input type="text" id="name" placeholder="প্রতিনিধির নাম">
  <input type="tel" id="mobile" placeholder="মোবাইল">
  <button onclick="saveWard()">সেভ</button>
  <h3 style="margin-top:15px;">সকল প্রতিনিধি</h3>
  <div id="wardList">লোড হচ্ছে...</div>
</div>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, collection, addDoc, getDocs, deleteDoc, updateDoc, doc, query, orderBy, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBV_XpVRx7fbIMBSDmcjc6BNxIoamQ7SoA",
  authDomain: "babul-union-7.firebaseapp.com",
  projectId: "babul-union-7",
  storageBucket: "babul-union-7.firebasestorage.app",
  messagingSenderId: "424653767943",
  appId: "1:424653767943:web:696e371ded9477e04831a2"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
let editingId = null;

function showStatus(msg){
  const el = document.getElementById('status');
  el.className = 'success';
  el.innerText = msg;
  el.style.display = 'block';
  setTimeout(()=> el.style.display='none', 3000);
}

// === BASE64 UPLOAD SYSTEM ===
function handleFileUpload(inputId, previewId, storageKey){
  document.getElementById(inputId).addEventListener('change', function(e){
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = function(event){
      const base64 = event.target.result;
      localStorage.setItem(storageKey, base64); // ব্রাউজারে সেভ
      document.getElementById(previewId).src = base64;
      document.getElementById(previewId).style.display = 'block';
      showStatus('ছবি সিলেক্ট হয়েছে। এখন সেভ করুন বাটন চাপেন');
    }
    reader.readAsDataURL(file);
  });
}
handleFileUpload('logoUpload', 'logoPreview', 'site_logo');
handleFileUpload('bannerUpload', 'bannerPreview', 'site_banner');

// আগের সেটিংস লোড
async function loadCurrentSettings(){
  const snap = await getDoc(doc(db, "settings", "hero"));
  if(snap.exists()){
    const data = snap.data();
    document.getElementById('candidateName').value = data.name || '';
    document.getElementById('slogan').value = data.slogan || '';

    // localStorage থেকে ছবি লোড
    const savedLogo = localStorage.getItem('site_logo');
    const savedBanner = localStorage.getItem('site_banner');
    if(savedLogo){
      document.getElementById('logoPreview').src = savedLogo;
      document.getElementById('logoPreview').style.display = 'block';
    }
    if(savedBanner){
      document.getElementById('bannerPreview').src = savedBanner;
      document.getElementById('bannerPreview').style.display = 'block';
    }
  }
}
loadCurrentSettings();

// সেটিংস সেভ - এখন Firebase এ base64 সেভ হবে
window.saveSettings = async function() {
  const name = document.getElementById('candidateName').value;
  const slogan = document.getElementById('slogan').value;
  const logoUrl = localStorage.getItem('site_logo') || ''; // base64
  const bannerUrl = localStorage.getItem('site_banner') || ''; // base64

  await setDoc(doc(db, "settings", "hero"), {name, slogan, logoUrl, bannerUrl});
  showStatus('সেটিংস সফলভাবে সেভ হয়েছে ✅');
}

// ওয়ার্ড সেভ
window.saveWard = async function() {
  const wardNo = document.getElementById('wardNo').value.trim();
  const name = document.getElementById('name').value.trim();
  const mobile = document.getElementById('mobile').value.trim();
  if(!wardNo ||!name ||!mobile) return alert('সব ঘর পূরণ করুন');

  if(editingId){
    await updateDoc(doc(db, "wards", editingId), {wardNo, name, mobile});
    editingId = null;
  } else {
    await addDoc(collection(db, "wards"), {wardNo, name, mobile});
  }
  document.getElementById('wardNo').value = '';
  document.getElementById('name').value = '';
  document.getElementById('mobile').value = '';
  loadWards();
  showStatus('সেভ হয়েছে');
}

window.editWard = function(id, wardNo, name, mobile){
  editingId = id;
  document.getElementById('wardNo').value = wardNo;
  document.getElementById('name').value = name;
  document.getElementById('mobile').value = mobile;
  window.scrollTo(0,0);
}

window.deleteWard = async function(id){
  if(confirm('ডিলিট করতে চান?')){
    await deleteDoc(doc(db, "wards", id));
    loadWards();
  }
}

async function loadWards() {
  const q = query(collection(db, "wards"), orderBy("wardNo"));
  const snap = await getDocs(q);
  let html = '';
  snap.forEach((d) => {
    const data = d.data();
    html += `<div class="ward-box">
      <b>ওয়ার্ড ${data.wardNo}</b><br>
      প্রতিনিধি: ${data.name}<br>
      মোবাইল: ${data.mobile}<br>
      <button class="edit-btn" onclick="editWard('${d.id}','${data.wardNo}','${data.name}','${data.mobile}')">Edit</button>
      <button class="del-btn" onclick="deleteWard('${d.id}')">Delete</button>
    </div>`;
  });
  document.getElementById('wardList').innerHTML = html || 'কোনো প্রতিনিধি নেই';
}
loadWards();
</script>
</body>
</html>
